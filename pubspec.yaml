name: nai
description: NAI - Nigeria's AI Assistant
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8


  # Supabase
  supabase_flutter: ^2.8.0

  # Navigation
  go_router: ^17.1.0

  # Networking
  internet_connection_checker_plus: ^2.9.1+2
  dio: ^5.9.2
  http: ^1.6.0
  xml: ^6.5.0

  # State Management
  fpdart: ^1.2.0
  equatable: ^2.0.7
  flutter_riverpod: ^3.2.1

  # Storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Images & SVG
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4

  # Icons
  iconsax_plus: ^1.0.0

  # Shimmer / Skeleton
  skeletonizer: ^2.1.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1

  # Environment
  flutter_dotenv: ^6.0.0

  # Logging
  logger: ^2.6.2

  # Media
  image_picker: ^1.2.1
  file_picker: ^10.3.10

  # Utilities
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  uuid: ^4.5.1

  # Device & System
  device_info_plus: ^11.2.0
  app_version_update: ^6.2.0

  # Localization
  easy_localization: ^3.0.8

  flutter_native_splash: ^2.4.7

  # Chat message features
  flutter_markdown: ^0.7.4
  share_plus: ^10.1.2
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  hive_ce_generator: ^1.11.1
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  test_api: 0.7.6

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/nai_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F1115"
  adaptive_icon_foreground: "assets/icons/nai_logo.png"

flutter_native_splash:
  color: "#0F1115"
  image: "assets/icons/nai_logo.png"
  android_12:
    image: "assets/icons/nai_logo.png"
    color: "#0F1115"
