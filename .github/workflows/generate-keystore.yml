name: Generate Release Keystore (run once, manually)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and passwords
        run: |
          STORE_PASSWORD=$(openssl rand -base64 24)
          KEY_PASSWORD=$(openssl rand -base64 24)
          ALIAS="nai"

          keytool -genkeypair -v \
            -keystore nai-release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=NAI, OU=Zetra, O=Zetra Systems, L=Lagos, ST=Lagos, C=NG"

          base64 -w 0 nai-release.keystore > keystore_base64.txt

          {
            echo "KEYSTORE_BASE64:"
            cat keystore_base64.txt
            echo ""
            echo "KEYSTORE_PASSWORD: $STORE_PASSWORD"
            echo "KEY_ALIAS: $ALIAS"
            echo "KEY_PASSWORD: $KEY_PASSWORD"
          } > secrets_to_copy.txt

          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Push secrets directly to this repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS_WRITE }}
        run: |
          gh secret set KEYSTORE_BASE64 --repo "${{ github.repository }}" < keystore_base64.txt
          gh secret set KEYSTORE_PASSWORD --repo "${{ github.repository }}" --body "$STORE_PASSWORD"
          gh secret set KEY_ALIAS --repo "${{ github.repository }}" --body "$ALIAS"
          gh secret set KEY_PASSWORD --repo "${{ github.repository }}" --body "$KEY_PASSWORD"

      - name: Upload keystore backup — download this, then delete it
        uses: actions/upload-artifact@v4
        with:
          name: nai-keystore-DELETE-AFTER-DOWNLOADING
          path: |
            nai-release.keystore
            secrets_to_copy.txt
          retention-days: 1
